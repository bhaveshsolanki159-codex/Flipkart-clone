<!DOCTYPE html>
<html>
<head>
<style>
  .dots-container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    gap: 10px;
  }

  .dot {
    width: 15px;
    height: 15px;
    background-color: #3498db;
    border-radius: 50%;
    opacity: 0;
    animation: pulse 1.5s infinite;
  }
  
  .dot:nth-child(2) { animation-delay: 0.3s; }
  .dot:nth-child(3) { animation-delay: 0.6s; }

  @keyframes pulse {
    0%, 100% { opacity: 0; }
    50% { opacity: 1; }
  }
  
</style>
</head>
<body>

<div class="dots-container">
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
</div>

</body>
</html>
