<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: rgb(213, 213, 255);
      display: flex;
      justify-content: center;
    }

    .profile-card {
      border: 2px solid white;
      width: 25%;
      background-color: white;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      text-align: center;
      border-radius: 10%;
      margin-top: 10%;
      margin-bottom: 10%;
    }
    .banner {
      height: 150px;
    }
    .banner img {
      width: 100%;
      height: 150px;
      border-radius: 10% 10% 10% 10%;
      object-fit: cover;
    }

    .profile-img {
      position: relative;
      bottom: 50px;
    }

    .profile-img img {
      width: 100px;
      height: 100px;
      border: 5px solid white;
      border-radius: 50%;
    }

    .insight-card {
      width: 85%;
      height: 100px;
      margin: 40px auto;
      border: 1px solid #ddd;
      border-radius: 25px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .username {
      margin-top: -40px;
    }

    .username h2 {
      font-weight: bold;
      color: #111;
    }

    .discription {
      margin-top: 20px;
    }

    .discription p {
      color: #666;
    }

    .social-icon {
      display: flex;
      justify-content: space-around;
      width: 50%;
      align-self: center;
      margin-bottom: 15px;
    }
  </style>
  <body>
    <div class="profile-card">
      <div class="banner">
        <img
          src="../img/beautiful-sunset-on-summer-background-free-vector.webp"
          alt="profile banner"
        />
      </div>
      <div class="profile-img">
        <img
          src="../img/profile-picture-vector-illustration.webp"
          alt="profile picture"
        />
      </div>
      <div class="username"><h2>Bhavesh Solanki</h2></div>
      <div class="discription"><p>Data Analyst</p></div>
      <div class="insight-card">
        <div class="insight">
          <div class="numbers"><h3>72.9K</h3></div>
          <div class="name">likes</div>
        </div>
        <div class="insight">
          <div class="numbers"><h3>828</h3></div>
          <div class="name">Post</div>
        </div>
        <div class="insight">
          <div class="numbers"><h3>342.9K</h3></div>
          <div class="name">Views</div>
        </div>
      </div>
      <div class="social-icon">
        <img
          width="24"
          height="24"
          src="https://img.icons8.com/material/24/twitter--v2.png"
          alt="twitter--v2"
        />
        <img
          width="24"
          height="24"
          src="https://img.icons8.com/material/24/instagram-new--v1.png"
          alt="instagram-new--v1"
        />
        <img
          width="24"
          height="24"
          src="https://img.icons8.com/material/24/linkedin--v1.png"
          alt="linkedin--v1"
        />
      </div>
    </div>
  </body>
</html>
