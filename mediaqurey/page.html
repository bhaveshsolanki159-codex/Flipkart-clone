<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      height: 100%;
      width: 100%;
      font-family: sans-serif;
      background-color: white;
      color: black;
    }

    .nav {
      display: flex;
      justify-content: center;
      height: 60px;
      border: 2px solid grey;
    }

    .logo {
      place-content: center;
      width: 60%;
      font-size: x-large;
      font-weight: 700;
      padding: 0 0 0 0px;
    }

    .link {
      display: flex;
      justify-content: space-around;
      width: 26%;
      height: fit-content;
      place-self: center;
    }

    .main-cont {
      display: flex;
      justify-content: center;
      height: 50%;
      width: 100%;
    }

    .left-content {
      height: 80%;
      display: inline-grid;
      justify-content: center;
      align-items: center;
    }

    .left-content h1 {
      height: 41px;
    }

    .button button {
      border: 2px solid white;
      color: white;
      background-color: blue;
      height: 50px;
      width: 125px;
      border-radius: 15px;
    }
  </style>
  <body>
    <div class="nav">
      <div class="logo">MyBrand</div>
      <div class="link">
        <h4>Home</h4>
        <h4>Home</h4>
        <h4>Home</h4>
        <h4>Home</h4>
      </div>
    </div>

    <div class="main-cont">
      <div class="left-content">
        <h1>Learn Responsive Web Design</h1>
        <p>Build Website that work beautiful on every device</p>

        <div class="button"><button type="submit">Get Started</button></div>
      </div>
      <div>
        <img src="" alt="" />
      </div>
    </div>
  </body>
</html>
