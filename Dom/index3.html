<!doctype html>
<html lang="en">
  <head>
    <title>DOM Practice Solution</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f2f2f2;
        padding: 40px;
      }

      #container {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-top: 20px;
      }

      button {
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        background: orangered;
        color: white;
        cursor: pointer;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <button>Create Student Card</button>
    <div id="container"></div>

    <script>
      const btn = document.querySelector("button");
      const container = document.querySelector("#container");

      btn.addEventListener("click", () => {
        const form = document.createElement("form");

        form.innerHTML = `
        <label class="form_labels">Name:</label>
        <input type="text" class="input">

        <label class="form_labels">Department:</label>
        <input type="text" class="input">

        <label class="form_labels">CGPA:</label>
        <input type="text" class="input">
        `;
        form.style.display = "flex";
        form.style.flexDirection = "column";
        form.style.gap = "10px";
        form.style.background = "white";
        form.style.padding = "20px";
        form.style.borderRadius = "10px";
        form.style.boxShadow = "0 0 10px rgba(0,0,0,0.1)";
        const labels = form.querySelectorAll(".form_labels");

        labels.forEach((label) => {
          label.style.fontWeight = "bold";
          label.style.color = "#333";
          label.style.marginTop = "10px";
        });
        const inputs = form.querySelectorAll(".input");

        inputs.forEach((input) => {
          input.style.padding = "10px";
          input.style.border = "1px solid #ccc";
          input.style.borderRadius = "6px";
          input.style.fontSize = "16px";
        });

        container.appendChild(form);
      });
    </script>
  </body>
</html>
