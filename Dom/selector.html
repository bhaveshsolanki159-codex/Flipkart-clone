<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Selector</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            background-color: black;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
        }
    </style>
</head>
<body>
    <div class="bg-black">
        <h1 id="title" class="heading">Hello, User! its a<span style='display: none;'>Hidden</span> text.</h1>
        <h1 id="title2" class="heading">Another Title</h1>
        <h1 id="title3" class="heading">Yet Another Title</h1>

        <p>Lorem ipsum dolor sit amet.</p>

        <input type="password"  id="passwordInput" placeholder="Enter your password">

        <ul id="list">
            <li class="list-item">Item 1</li>
            <li class="list-item">Item 2</li>
            <li class="list-item">Item 3</li>
        </ul>
    </div>

    <script>
        const title = document.getElementById("title")
        document.getElementById('title').class // GIVES undefined because class is a reserved keyword in JS USE className instead
        document.getElementById('title').className;
        document.getElementById("title").getAttribute("id")
        document.getElementById("title").getAttribute("class")
        // document.getElementById("title").setAttribute("class","text") // Override class name and give a undefined

        document.getElementById("title").setAttribute("style","color:red") // Change the color of the title to red

        title.style.backgroundColor = "green" // Change the background color of the title to green
        title.style.padding = "20px" // Change the padding of the title to 20px
        title.style.borderRadius = "10px" 


        title.innerHTML // GIVES the whole html 

        title.textContent // GIVES text that is hidden in the span tag as well
        title.innerText // GIVES text that other than the hidden text in the span tag
        
        document.getElementsByClassName('bg-black') 

        document.getElementsByTagName('h1')
        document.getElementsByTagName('p')

        document.querySelector('.heading') // GIVES the first element with the class name
        document.querySelectorAll('.heading') // GIVES all the elements with the class name

        const templilist = document.querySelectorAll('li') // GIVES nodeList of all the li elements
        // nodelist and HTML collection are not array but we can use forEach on nodelist but not on HTML collection

        templilist[0].style.color = "red" // Change the color of the first li element to red
        // templilist.style.color = "blue" // GIVES TypeError because nodelist is not an array

        templilist.forEach((item) => {
            item.style.color = "blue" // Change the color of all the li elements to blue
        })

        document.querySelector('input[type="password"]') // GIVES the first input element with the type password

        const tempClassList = document.getElementsByClassName("list-item") // GIVEES HTML Collection. On HTML collection we cannot use forEach because it is not an array.
        // where as in querySelectorAll we get nodelist and we can use forEach on it because nodelist is an array like object.

        Array.from(tempClassList) // convert HTML collection to array and then we can use forEach on it
        tempClassList.forEach(function(li) {
            console.log(li)
        }) // gives TypeError because HTML collection is not an array and we cannot use forEach on it

    </script>

</body>
</html>
