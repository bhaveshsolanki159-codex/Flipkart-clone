<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Generator</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .container {
        width: 700px;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
      }

      button {
        width: 100%;
        padding: 14px;
        background: #4a90e2;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
        transition: 0.3s;
      }

      .output {
        margin-top: 25px;
      }

      .output h2 {
        margin-bottom: 10px;
        color: #333;
      }

      p {
        background: #1e1e1e;
        color: #00ff7f;
        padding: 15px;
        border-radius: 8px;
        overflow-x: auto;
        min-height: 200px;
        font-family: Consolas, monospace;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Code Generator</h1>

      <button id="generate">Generate Code</button>

      <div class="output">
        <h2>Generated Code</h2>
        <p id="p1"></p>
      </div>
    </div>
  </body>
  <script>
    const quotes = [
        { quote: "Stay Hungry. Stay Foolish.", author: "Steve Jobs" },
        {
            quote: "Be yourself; everyone else is already taken.",
            author: "Oscar Wilde"
        },
        { quote: "The harder you work, the luckier you get.", author: "Generic" },
        { quote: "The best way to predict the future is to create it.",
          author: "Peter Drucker"
        },
        {
          quote: "Success is not final, failure is not fatal: It is the courage to continue that counts.",
          author: "Winston Churchill"
        },
        {
          quote: "Believe you can and you're halfway there.",
          author: "Theodore Roosevelt"
        },
        {
          quote: "Don't watch the clock; do what it does. Keep going.",
          author: "Sam Levenson"
        },
        {
          quote: "The only limit to our realization of tomorrow will be our doubts of today.",
          author: "Franklin D. Roosevelt"
        },
        {
          quote: "The future belongs to those who believe in the beauty of their dreams.",
          author: "Eleanor Roosevelt"
        },
        {
          quote: "It does not matter how slowly you go as long as you do not stop.",
          author: "Confucius"
        },
        {
          quote: "You are never too old to set another goal or to dream a new dream.",
          author: "C.S. Lewis"
        },
        {
          quote: "The only way to do great work is to love what you do.",
          author: "Steve Jobs"
        },
        {
          quote: "In the middle of every difficulty lies opportunity.",
          author: "Albert Einstein"
        }
    ];

    const res = document.querySelector("#p1");
    const btn = document.querySelector("#generate");

    document.addEventListener("click", () => {
        let random = quotes[Math.floor(Math.random() * quotes.length)];
        let text = random.quote;
        let author = random.author;

        res.innerHTML = text + " ~ "+ author;
    })
  </script>
</html>
