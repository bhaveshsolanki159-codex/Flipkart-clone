<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", sans-serif;
            background-color: #f5f5f5;
            color: #333;
            transition: background-color 0.3s, color 0.3s;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
        }

        label {
            margin: 10px 0;
        }

        input {
            padding: 5px;
            margin-bottom: 10px;
        }

        h3 {
            text-align: center;
            margin-top: 20px;
        }

        ul {
            list-style-type: none;
            padding: 0;
            text-align: center;
        }

        .result {
            margin-top: 20px;
            font-size: 1.2em;
            color: #007BFF;
        }
    </style>
</head>
<body>
    
    <form  method="post">
        <label for="weight">Weight (kg):</label>
        <input type="number" id="weight" name="weight" required>

        <label for="height">Height (cm):</label>
        <input type="number" id="height" name="height" step="0.01" required>

        <button type="submit">Calculate BMI</button>

        <div class="result">Result</div>
    </form>

    <h3>BMI Weight Guide</h3>
    <ul>
        <li>Underweight: BMI less than 18.5</li>
        <li>Normal weight: BMI between 18.5 and 24.9</li>
        <li>Overweight: BMI between 25 and 29.9</li>
        <li>Obesity: BMI of 30 or greater</li>
    </ul>
</body>

<script>
    const form = document.querySelector('form');

    form.addEventListener('submit', function(e) {
        e.preventDefault(); // prevent the form from submitting to server

        const weight = parseInt(document.querySelector('#weight').value); // GET the value but in string => convert to number through parseInt
        const height = parseInt(document.querySelector('#height').value); 
        const resultDiv = document.querySelector('.result');

        if (isNaN(weight) || isNaN(height) || height < 0 || weight < 0) {
            alert('Please enter valid positive numbers for weight and height.');
        }

        const bmi = weight / (height * height / 10000);
        alert('Your BMI is: ' + bmi.toFixed(2));
        
    })
</script>
</html>
