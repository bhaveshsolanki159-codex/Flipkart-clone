<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Edit</title>
    <style>
        /* General Page Reset */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Container Styling */
        .container {
            background: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            transition: transform 0.3s ease;
        }


        h1 {
            color: #333;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }

        /* Editable Text Styling */
        .text {
            font-size: 1.1rem;
            color: #555;
            line-height: 1.6;
            padding: 10px;
            border: 1px dashed transparent;
            border-radius: 6px;
            min-height: 20px;
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
            word-wrap: break-word;
        }

        /* State: When text is being edited (toggle this class via JS) */
        .text.editing {
            border-color: #007bff;
            background-color: #f0f8ff;
            outline: none;
            cursor: text;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }

        /* Button Container */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        /* Base Button Styling */
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>About Me</h1>
        <div class="text" id="aboutText">I am learning DOM manipulation and building interactive web pages.</div>

        <div class="buttons">
            <button id="editBtn">Edit</button>
            <button id="saveBtn">Save</button>
        </div>
    </div>

    <script>
        const textDiv = document.getElementById('aboutText');
        const editBtn = document.getElementById('editBtn');
        const saveBtn = document.getElementById('saveBtn');

        editBtn.addEventListener('click', () => {
            textDiv.contentEditable = "true";
            textDiv.classList.add('editing');
            textDiv.focus();
        });

        saveBtn.addEventListener('click', () => {
            textDiv.contentEditable = "false";
            textDiv.classList.remove('editing');
        });
    </script>
</body>
</html>
