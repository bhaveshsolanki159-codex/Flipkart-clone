<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Elements</title>
</head>
<body>
    <div class="parent">
        <div class="day">Mon</div>
        <div class="day">Tues</div>
        <div class="day">Wed</div>
        <div class="day">Thus</div>
    </div>

</body>
<script>
    const parent = document.querySelector(".parent");
    console.log(parent);
    console.log(parent.children);

    /* for (let i=0; i < parent.children.length; i++) {
        const element = parent.children[i].innerHTML;
        console.log(element);
    } */

    parent.children[1].style.color = "orange";
    console.log(parent.firstElementChild);
    console.log(parent.lastElementChild); 

    const dayOne = document.querySelector(".day");
    console.log(dayOne);
    console.log(dayOne.parentElement);

    console.log(dayOne.nextElementSibling);

    console.log("Nodes:", parent.childNodes); // GIVES ALL THE NODES INCLUDING TEXT NODES (TEXT NODES ARE THE SPACES BETWEEN ELEMENTS) -> 9
    
</script>
</html>
