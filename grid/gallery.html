    .container {
      display: grid;

      grid-template-columns: repeat(3,1fr);
      grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
      grid-template-rowS: 4fr;
      grid-gap: 16px;
    }

    .box {
      border: 2px solid white;
      border-radius: 2px;
      text-align: center;
      align-content: center;
      font-size: 60px;
    }
